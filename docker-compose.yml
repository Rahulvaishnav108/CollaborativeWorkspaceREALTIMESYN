version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: syncspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: syncspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - syncspace-network

  # Redis for caching and real-time events
  redis:
    image: redis:7-alpine
    container_name: syncspace-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - syncspace-network

  # MinIO for S3-compatible file storage
  minio:
    image: minio/minio:latest
    container_name: syncspace-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - syncspace-network

  # Backend API (development)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: syncspace-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/syncspace
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: syncspace-files
      JWT_SECRET: your-jwt-secret-key
      SESSION_SECRET: your-session-secret-key
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - syncspace-network
    profiles:
      - full

  # Frontend Web App (development)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: syncspace-web
    restart: unless-stopped
    environment:
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - syncspace-network
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  syncspace-network:
    driver: bridge